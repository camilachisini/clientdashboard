name: Update dashboard data

on:
  schedule:
    # Every 30 minutes, Monday to Friday (UTC)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch tasks from Asana
        run: node scripts/fetch-asana.mjs
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
      - name: Commit data.json if it changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update dashboard data" && git push)
